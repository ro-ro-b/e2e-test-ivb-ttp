name: Publish Neon City game
on:
  push:
    branches: [neon-city-game]
    paths:
      - 'neon-city/game-*.txt'
      - 'neon-city/build.py'
      - '.github/workflows/neon-city-publish.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neon-city-game
      - name: Reconstruct and verify game
        run: python3 neon-city/build.py
      - name: Publish standalone HTML
        run: |
          git config user.name 'Neon City Build'
          git config user.email 'neon-city-build@users.noreply.github.com'
          git add neon-city/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified standalone Neon City basketball game'
            git push origin HEAD:neon-city-game
          fi
          echo "PLAY_URL=https://rawcdn.githack.com/${GITHUB_REPOSITORY}/$(git rev-parse HEAD)/neon-city/index.html" >> "$GITHUB_STEP_SUMMARY"
